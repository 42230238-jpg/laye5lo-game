        ${mySkips?`<div class="skip-stack">SKIP x${mySkips}</div>`:''}
        <div class="my-name-ring">
          <div class="avatar ${isMyTurn&&!S.over?'active':''} ${S.skipFx===0?'skipped':''}" style="width:100%;height:100%;font-size:20px;border-radius:50%">${me.emoji}</div>
        </div>
        <div>
          <div class="pname" style="font-size:12px;font-weight:700">You • ${me.score}pts</div>
          <div style="font-size:9px;color:#ffe066;font-weight:700">Phase ${me.phase+1}${me.phase<10?': '+PHASES[me.phase].desc:' ✓ All done!'}</div>
        </div>
      </div>
      <div id="my-hand" data-hand-pid="0">${me.hand.map(c=>rCard(c,S.sel.has(c.id),active)).join('')}</div>
      ${active?`<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;padding:2px 4px">
        ${canDiscard?`<button class="chip-btn gold" style="font-size:10px" onclick="doDiscard(${selInHand[0].id})">Discard & End Turn</button>`:`<div class="status-bar" style="font-size:9px;padding:3px 12px;min-width:0">Select 1 card from hand to discard</div>`}
      </div>
      ${rAddBtns(me)}`:''}
    </div>
  </div>`;
}

function rMenu(){
  return`<div class="menu-screen">
    <div class="menu-mark">
      <div class="menu-card-stack">
        <div class="menu-card menu-card-red" style="font-size:26px">7</div>
        <div class="menu-card menu-card-blue" style="font-size:16px;font-weight:900">P10</div>
        <div class="menu-card menu-card-gold" style="font-size:24px;color:#1a1200">W</div>
      </div>
      <h1>Phase 10</h1>
      <p>Complete all 10 phases before your opponents to win!</p>
    </div>
    <div class="difficulty-box">
      <div class="difficulty-label">Players</div>
      <div class="difficulty-options" style="grid-template-columns:repeat(4,1fr)">
        ${[3,4,5,6].map(n=>`<button class="difficulty-btn ${S.playerCount===n?'active':''}" onclick="setQuickPlayers(${n})">${n}</button>`).join('')}
      </div>
    </div>
    <div class="menu-actions">
      <button class="menu-btn primary" onclick="startGame()">▶ Play Now</button>
      <button class="menu-btn" onclick="openRoomMenu()">Custom Room</button>
      <button class="menu-btn" onclick="showRules()">📖 How to Play</button>
    </div>
  </div>`;
}

function rRoomMenu(){
  return`<div class="menu-screen"><div class="room-panel">
    <div class="title" style="font-size:28px">Phase 10 Online</div>
    <div class="subtitle">Create a room or join friends with a code.</div>
    <div class="difficulty-box" style="width:100%">
      <div class="difficulty-label">Room Seats</div>
      <div class="difficulty-options" style="grid-template-columns:repeat(4,1fr)">
        ${[3,4,5,6].map(n=>`<button class="difficulty-btn ${Number(S.roomSeats||4)===n?'active':''}" onclick="setRoomSeats(${n})">${n}</button>`).join('')}
      </div>
    </div>
    <div class="menu-actions">
      <button class="menu-btn primary" onclick="createPhase10Room()">Create Room</button>
      <button class="menu-btn" onclick="showJoinRoom()">Join Room</button>
      <button class="menu-btn subtle" onclick="leavePhase10Room()">Back</button>
    </div>
    <div class="room-msg">${S.roomMsg||''}</div>
  </div></div>`;
}

function rJoinRoom(){
  return`<div class="menu-screen"><div class="room-panel">
    <div class="title" style="font-size:28px">Join Phase 10</div>
    <input class="room-input" maxlength="6" placeholder="CODE" value="${S.joinCode||''}" oninput="S.joinCode=this.value.toUpperCase();this.value=S.joinCode">
    <input class="room-input" maxlength="16" placeholder="NAME" value="${S.joinName||''}" oninput="S.joinName=this.value">
    <div class="menu-actions">
      <button class="menu-btn primary" onclick="joinPhase10Room()">Join</button>
      <button class="menu-btn subtle" onclick="openRoomMenu()">Back</button>
    </div>
    <div class="room-msg">${S.roomMsg||''}</div>
  </div></div>`;
}

function rLobby(){
  const seats=S.seats||[];
  const count=seats.length||Number(S.roomSeats)||4;
  return`<div class="menu-screen"><div class="room-panel">
    <div class="title" style="font-size:28px">Phase 10 Room</div>
    <div class="room-code">${S.roomCode||''}</div>
    <div class="seat-list">${Array.from({length:count},(_,i)=>{
      const seat=seats[i];
      return`<div class="seat-box ${seat?.type==='host'?'host':''} ${!seat?'empty':''}">
        <div class="seat-name">${seat?escapeHtml(seat.name||('Player '+(i+1))):'Empty'}</div>
        <div class="seat-role">${seat?(seat.type==='host'?'Host':'Player'):'Seat '+(i+1)}</div>
      </div>`;
    }).join('')}</div>
    <div class="menu-actions">
      ${S.isHost?`<button class="menu-btn primary" onclick="startPhase10Room()">Start Game</button>`:''}
      <button class="menu-btn subtle" onclick="leavePhase10Room()">Back</button>
    </div>
    <div class="room-msg">${S.roomMsg||`All ${count} seats must be filled before starting.`}</div>
  </div></div>`;
}

function rRules(){
  const entries=[
    ['🎯 Objective','Be the first player to complete all 10 Phases in order. Each round, draw cards, build your phase, lay it down, and empty your hand.'],
    ['🃏 Your Turn','1. Draw a card from the deck or discard pile.\n2. Select cards and click "+ Add" to stage them for your phase groups.\n3. Click "✓ Lay Down Phase" when groups are valid.\n4. Add extra cards to any player\'s laid-down groups.\n5. Select 1 card from your hand and click "Discard & End Turn".'],
    ['📋 The 10 Phases',PHASES.map((p,i)=>`Phase ${i+1}: ${p.desc}`).join('\n')],
    ['🃏 Special Cards','Wild (W, 25pts): substitutes for any number in a phase group.\nSkip (S, 15pts): discard to make the next player lose their turn.'],
    ['🏆 Winning','Complete Phase 10 and go out (empty your hand) first to win! If you can\'t complete your phase this round, you keep working on it next round.'],
    ['📊 Scoring','Cards remaining in hand add penalty points:\n1–9 = face value · 10–12 = 10pts · Skip = 15pts · Wild = 25pts'],
  ];
  return`<div class="menu-screen" style="gap:10px;overflow-y:auto">
    <button class="back-arrow" onclick="backToMenu()">‹</button>
    <div class="menu-mark"><h1 style="font-size:22px">How to Play</h1></div>
    <div style="width:min(360px,94%);display:flex;flex-direction:column;gap:7px">
      ${entries.map(([t,b])=>`<div style="background:rgba(0,0,0,0.28);border:1px solid rgba(255,255,255,0.09);border-radius:10px;padding:11px 13px"><div style="color:#ffe066;font-size:11px;font-weight:800;margin-bottom:5px">${t}</div><div style="color:rgba(255,255,255,0.72);font-size:10.5px;line-height:1.55;white-space:pre-line">${b}</div></div>`).join('')}
    </div>
    <button class="menu-btn primary" style="width:160px;height:36px;font-size:13px" onclick="startGame()">▶ Play Now</button>
  </div>`;
}

function rRoundEnd(){
  const res=S.roundResults||S.players.map(p=>({...p,phase:p.phase,laid:false}));
  const now=S.players;
  return`<div class="menu-screen">
    <div class="modal-box" style="width:min(370px,calc(100% - 20px))">
      <h3>Round ${S.round-1} Over!</h3>
      <div class="modal-rows">
        ${res.map(r=>`<div class="modal-row ${r.laid?'':'danger'}">
          <div class="mn">${r.emoji} ${r.name}</div>
          <div class="mv" style="font-size:13px">${r.laid?'✓ Phase '+(r.phase+1)+' done':'✗ Phase '+(r.phase+1)+' failed'}</div>
          <div class="mn" style="color:#ffe066;margin-top:3px">${r.score} total pts</div>
        </div>`).join('')}
      </div>
      <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:8px;margin:8px 0;text-align:center">
        <div style="font-size:9px;color:rgba(255,255,255,0.5);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Next Round — Working On</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
          ${now.map(p=>`<span style="font-size:10px;color:#ffe066;font-weight:700">${p.emoji} P${p.phase+1}</span>`).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="menu-btn primary" style="max-width:150px;height:36px;font-size:13px" onclick="nextRound()">▶ Next Round</button>
        <button class="menu-btn subtle" style="max-width:100px;height:36px;font-size:12px" onclick="backToMenu()">Menu</button>
      </div>
    </div>
  </div>`;
}

function rOver(){
  const w=S.winner;
  const sorted=[...S.players].sort((a,b)=>a.score-b.score);
  return`<div class="menu-screen">
    <div class="menu-mark">
      <div class="menu-card-stack"><div class="menu-card menu-card-gold" style="font-size:32px">🏆</div></div>
      <h1>${w.isHuman?'You Win!':w.name+' Wins!'}</h1>
      <p>${w.emoji} ${w.name} completed all 10 phases first!</p>
    </div>
    <div style="width:min(280px,90%);background:rgba(0,0,0,0.3);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.1)">
      <div style="font-size:9px;color:rgba(255,255,255,0.45);text-align:center;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Final Scores (lower = better)</div>
      ${sorted.map((p,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:7px;background:${i===0?'rgba(255,220,100,0.12)':'rgba(255,255,255,0.04)'};margin-bottom:4px">
        <span style="color:#fff;font-size:12px;font-weight:600">${['🥇','🥈','🥉','4️⃣'][i]} ${p.emoji} ${p.name}</span>
        <span style="color:#ffe066;font-weight:800;font-size:13px">${p.score}pts</span>
      </div>`).join('')}
    </div>
    <div class="menu-actions">
      <button class="menu-btn primary" onclick="startGame()">▶ Play Again</button>
      <button class="menu-btn subtle" onclick="backToMenu()">Main Menu</button>
    </div>
  </div>`;
}

// ── INIT ───────────────────────────────────────────────
initState();
render();

</script>
</body>
</html>
